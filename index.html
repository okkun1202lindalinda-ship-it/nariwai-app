<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>生業 -Nariwai-</title>
  <meta name="description" content="「今日いくら稼いだ？」が見えるアプリ、生業 -Nariwai- のサポート情報です。">
  <style>
    :root { color-scheme:light dark; --accent:#365e67; --bg:#f2f2f7; --surface:#fff; --text:#171719; --muted:#606068; --line:#d4d4d8; }
    @media (prefers-color-scheme:dark) { :root { --bg:#000; --surface:#1c1c1e; --text:#f5f5f7; --muted:#aaaab2; --line:#3a3a3c; --accent:#8bc3cb; } }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif; line-height:1.75; }
    main { width:min(760px,calc(100% - 32px)); margin:0 auto; padding:64px 0 88px; }
    .eyebrow { margin:0 0 8px; color:var(--accent); font-size:13px; font-weight:700; }
    h1 { margin:0; font-size:clamp(34px,8vw,56px); letter-spacing:-.045em; line-height:1.12; }
    .lead { margin:14px 0 0; color:var(--muted); font-size:18px; }
    nav { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; margin-top:34px; }
    a { padding:22px; border:1px solid var(--line); border-radius:20px; background:var(--surface); color:var(--text); font-weight:700; text-decoration:none; }
    a span { display:block; margin-top:4px; color:var(--muted); font-size:13px; font-weight:400; }
    footer { margin-top:34px; color:var(--muted); font-size:13px; }
    @media (max-width:560px) { nav { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">生業 -Nariwai-</p>
    <h1>「今日いくら稼いだ？」が<br>見えるアプリ</h1>
    <p class="lead">本業も副業も、複数の収入源をひとつの「今日」にまとめます。</p>
    <nav aria-label="サポート情報">
      <a href="support/">サポート<span>使い方、よくある質問、お問い合わせ</span></a>
      <a href="privacy/">プライバシーポリシー<span>保存する情報とiCloud同期について</span></a>
    </nav>
    <footer>© 2026 Takumi Yoshikawa</footer>
  </main>
</body>
</html>
